<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Timeblock</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        :root {
            --bg: #F7F5F1;
            --surface: #FFFFFF;
            --border: #E4E1DA;
            --text: #23221F;
            --text-muted: #8C887E;
            --accent: #B5562D;
            --accent-soft: #F3E2D9;
        }
        body {
            background-color: var(--bg);
            color: var(--text);
            font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Segoe UI", Roboto, "Malgun Gothic", sans-serif;
        }

        .task-card {
            transition: transform 0.12s ease, box-shadow 0.12s ease;
            cursor: grab;
            border-left: 3px solid transparent;
        }
        .task-card:active { cursor: grabbing; }
        .task-card.dragging {
            opacity: 0.55;
        }

        .time-slot { transition: background-color 0.15s ease; }
        .time-slot.drag-over {
            background-color: var(--accent-soft);
        }

        .resize-handle:hover {
            background-color: rgba(0, 0, 0, 0.12);
            border-radius: 0 0 4px 4px;
        }

        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-thumb { background: #D8D4CC; border-radius: 10px; }

        .view-toggle-btn {
            transition: color 0.15s ease, background-color 0.15s ease;
        }

        .today-pill {
            background-color: var(--accent);
            color: #fff;
        }
    </style>
</head>
<body class="h-screen p-4 flex gap-4 text-[15px]">

    <!-- 왼쪽: 할 일 목록 -->
    <div class="w-72 shrink-0 bg-[var(--surface)] rounded-lg border border-[var(--border)] p-5 flex flex-col">
        <h2 class="text-xs font-semibold uppercase tracking-wider text-[var(--text-muted)] mb-3">My Tasks</h2>

        <div class="flex gap-2 mb-5">
            <input type="text" id="taskInput" placeholder="새로운 할 일 입력..."
                class="flex-1 bg-[var(--bg)] border border-[var(--border)] rounded-md px-3 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-[var(--accent-soft)] focus:border-[var(--accent)] transition">
            <button onclick="addTask()"
                class="bg-[var(--accent)] hover:bg-[#9C4A28] text-white text-sm font-medium rounded-md px-4 py-2.5 transition active:scale-95">
                추가
            </button>
        </div>

        <div id="todoList" class="flex-1 overflow-y-auto space-y-2 min-h-[200px]"></div>
    </div>

    <!-- 오른쪽: 타임라인 / 주간 뷰 -->
    <div class="flex-1 bg-[var(--surface)] rounded-lg border border-[var(--border)] p-5 flex flex-col min-w-0">
        <div class="flex justify-between items-center mb-5">
            <div>
                <h2 class="text-base font-semibold tracking-tight" id="panelTitle">오늘의 타임라인</h2>
                <p class="text-xs text-[var(--text-muted)] mt-0.5" id="panelSubtitle"></p>
            </div>
            <div class="bg-[var(--bg)] border border-[var(--border)] p-0.5 rounded-md flex">
                <button id="dayViewBtn" onclick="setView('day')"
                    class="view-toggle-btn px-3.5 py-1.5 rounded-[5px] text-xs font-medium">오늘 하루</button>
                <button id="weekViewBtn" onclick="setView('week')"
                    class="view-toggle-btn px-3.5 py-1.5 rounded-[5px] text-xs font-medium">일주일</button>
            </div>
        </div>

        <!-- 일간 뷰 -->
        <div class="flex-1 overflow-y-auto pr-1" id="dayViewContainer"></div>

        <!-- 주간 뷰 -->
        <div class="flex-1 overflow-y-auto pr-1 hidden" id="weekViewContainer"></div>
    </div>

    <script>
        const START_HOUR = 7;
        const END_HOUR = 24;
        const TOTAL_ROWS = END_HOUR - START_HOUR + 1;
        const ROW_HEIGHT_DAY = 64;
        const ROW_HEIGHT_WEEK = 56;
        const DAY_LABELS = ['월', '화', '수', '목', '금', '토', '일'];

        const PALETTE = {
            clay:  { border: '#B5562D', tint: '#F3E2D9' },
            moss:  { border: '#5C7A5C', tint: '#E5EBE3' },
            slate: { border: '#4D5B66', tint: '#E4E8EA' },
        };
        const PALETTE_KEYS = Object.keys(PALETTE);

        // ---- date helpers ----
        function getMonday(d) {
            d = new Date(d);
            const day = d.getDay(); // 0 Sun..6 Sat
            const diff = (day === 0 ? -6 : 1) - day;
            d.setDate(d.getDate() + diff);
            d.setHours(0, 0, 0, 0);
            return d;
        }
        const today = new Date();
        const monday = getMonday(today);
        const weekDates = Array.from({ length: 7 }, (_, i) => {
            const d = new Date(monday);
            d.setDate(monday.getDate() + i);
            return d;
        });
        const todayIndex = today.getDay() === 0 ? 6 : today.getDay() - 1; // Mon=0..Sun=6
        function fmtDate(d) { return `${d.getMonth() + 1}월 ${d.getDate()}일`; }

        // ---- state ----
        let taskIdCounter = 4;
        let tasks = [
            { id: 'task-1', text: '아침 스트레칭 및 루틴', color: 'clay', day: null, hour: null, duration: 1 },
            { id: 'task-2', text: '신규 프로젝트 UI 스케치', color: 'slate', day: null, hour: null, duration: 1 },
            { id: 'task-3', text: '레퍼런스 리서치', color: 'moss', day: null, hour: null, duration: 1 },
        ];
        let currentView = 'day';
        let draggedTaskId = null;

        // ---- duration helpers ----
        function clampDuration(hour, duration) {
            const maxDur = TOTAL_ROWS - (hour - START_HOUR);
            return Math.max(1, Math.min(duration || 1, maxDur));
        }

        // ---- persistence (localStorage) ----
        const STORAGE_KEY = 'timeblock-data-v1';
        function saveState() {
            try {
                localStorage.setItem(STORAGE_KEY, JSON.stringify({ tasks, taskIdCounter }));
            } catch (e) { /* storage unavailable (e.g. sandboxed preview) - fail silently */ }
        }
        function loadState() {
            try {
                const raw = localStorage.getItem(STORAGE_KEY);
                if (!raw) return;
                const data = JSON.parse(raw);
                if (Array.isArray(data.tasks)) tasks = data.tasks;
                if (typeof data.taskIdCounter === 'number') taskIdCounter = data.taskIdCounter;
            } catch (e) { /* ignore corrupt/missing data */ }
        }

        // ---- rendering ----
        function backlogCardHTML(task) {
            const p = PALETTE[task.color];
            return `<div class="task-card font-medium text-sm pl-3 pr-2 py-2.5 rounded-md flex items-center justify-between gap-2"
                         style="background-color:${p.tint}; border-left-color:${p.border};"
                         draggable="true" data-task-id="${task.id}">
                        <span class="truncate">${escapeHTML(task.text)}</span>
                        <button class="delete-btn shrink-0 text-[var(--text-muted)] hover:text-[var(--accent)] text-xs leading-none px-1 py-0.5"
                                draggable="false" data-task-id="${task.id}" title="삭제">✕</button>
                    </div>`;
        }

        function placedCardHTML(task, rowHeight, gridColumn) {
            const p = PALETTE[task.color];
            const rowStart = task.hour - START_HOUR + 1;
            return `<div class="task-card font-medium text-sm pl-3 pr-2 py-2 rounded-md flex items-start justify-between gap-2 relative"
                         style="background-color:${p.tint}; border-left-color:${p.border}; grid-column:${gridColumn}; grid-row:${rowStart} / span ${task.duration}; margin:2px 4px; z-index:1;"
                         draggable="true" data-task-id="${task.id}">
                        <span class="truncate">${escapeHTML(task.text)}</span>
                        <button class="delete-btn shrink-0 text-[var(--text-muted)] hover:text-[var(--accent)] text-xs leading-none px-1 py-0.5"
                                draggable="false" data-task-id="${task.id}" title="목록으로 되돌리기">✕</button>
                        <div class="resize-handle" draggable="false" data-task-id="${task.id}" data-row-height="${rowHeight}"
                             style="position:absolute; left:4px; right:4px; bottom:0; height:7px; cursor:row-resize;"></div>
                    </div>`;
        }

        function placedCardHTMLWeek(task, rowHeight, gridColumn, rowOffset) {
            const p = PALETTE[task.color];
            const rowStart = task.hour - START_HOUR + 1 + rowOffset;
            return `<div class="task-card text-[11px] font-medium pl-1.5 pr-1 py-1 rounded flex items-start justify-between gap-1 relative"
                         style="background-color:${p.tint}; border-left-color:${p.border}; grid-column:${gridColumn}; grid-row:${rowStart} / span ${task.duration}; margin:1px 2px; z-index:1;"
                         draggable="true" data-task-id="${task.id}" title="${escapeHTML(task.text)}">
                        <span class="truncate">${escapeHTML(task.text)}</span>
                        <button class="delete-btn shrink-0 text-[10px] leading-none opacity-50 hover:opacity-100"
                                draggable="false" data-task-id="${task.id}" title="목록으로 되돌리기">✕</button>
                        <div class="resize-handle" draggable="false" data-task-id="${task.id}" data-row-height="${rowHeight}"
                             style="position:absolute; left:2px; right:2px; bottom:0; height:5px; cursor:row-resize;"></div>
                    </div>`;
        }

        function escapeHTML(str) {
            const div = document.createElement('div');
            div.textContent = str;
            return div.innerHTML;
        }

        function renderTodoList() {
            const list = document.getElementById('todoList');
            const unplaced = tasks.filter(t => t.day === null);
            list.innerHTML = unplaced.length
                ? unplaced.map(backlogCardHTML).join('')
                : `<p class="text-xs text-[var(--text-muted)] py-2">모두 일정에 배치됨</p>`;
        }

        function renderDayView() {
            const container = document.getElementById('dayViewContainer');
            container.style.display = 'grid';
            container.style.gridTemplateColumns = '56px 1fr';
            container.style.gridAutoRows = `${ROW_HEIGHT_DAY}px`;
            container.style.position = 'relative';

            let html = '';
            for (let h = START_HOUR; h <= END_HOUR; h++) {
                const row = h - START_HOUR + 1;
                const timeText = h === 24 ? '00:00' : `${h.toString().padStart(2, '0')}:00`;
                html += `<div class="text-right pr-3 py-2.5 text-xs font-medium text-[var(--text-muted)] tabular-nums border-b border-[var(--border)]"
                              style="grid-column:1; grid-row:${row};">${timeText}</div>`;
                html += `<div class="time-slot border-b border-[var(--border)]" data-hour="${h}"
                              style="grid-column:2; grid-row:${row};"></div>`;
            }
            const placed = tasks.filter(t => t.day === todayIndex && t.hour !== null);
            html += placed.map(t => placedCardHTML(t, ROW_HEIGHT_DAY, 2)).join('');
            container.innerHTML = html;
        }

        function renderWeekView() {
            const container = document.getElementById('weekViewContainer');
            const HEADER_ROWS = 1;
            container.style.display = 'grid';
            container.style.gridTemplateColumns = `48px repeat(7, 1fr)`;
            container.style.gridTemplateRows = `auto repeat(${TOTAL_ROWS}, ${ROW_HEIGHT_WEEK}px)`;
            container.style.position = 'relative';

            let html = `<div style="grid-column:1; grid-row:1;"></div>`;
            for (let d = 0; d < 7; d++) {
                const isToday = d === todayIndex;
                html += `
                    <div class="text-center py-1.5 border-b border-[var(--border)] sticky top-0 bg-[var(--surface)] z-10"
                         style="grid-column:${d + 2}; grid-row:1;">
                        <div class="text-xs font-medium ${isToday ? 'text-[var(--accent)]' : 'text-[var(--text-muted)]'}">${DAY_LABELS[d]}</div>
                        <div class="text-xs ${isToday ? 'today-pill inline-block rounded-full w-5 h-5 leading-5 font-semibold' : 'text-[var(--text-muted)]'} mt-0.5">${weekDates[d].getDate()}</div>
                    </div>`;
            }

            for (let h = START_HOUR; h <= END_HOUR; h++) {
                const row = h - START_HOUR + 1 + HEADER_ROWS;
                const timeText = h === 24 ? '00:00' : `${h.toString().padStart(2, '0')}:00`;
                html += `<div class="text-right pr-2 py-1.5 text-[11px] font-medium text-[var(--text-muted)] tabular-nums border-b border-[var(--border)]"
                              style="grid-column:1; grid-row:${row};">${timeText}</div>`;
                for (let d = 0; d < 7; d++) {
                    html += `<div class="time-slot border-b border-l border-[var(--border)]" data-day="${d}" data-hour="${h}"
                                  style="grid-column:${d + 2}; grid-row:${row};"></div>`;
                }
            }

            const placed = tasks.filter(t => t.day !== null && t.hour !== null);
            html += placed.map(t => placedCardHTMLWeek(t, ROW_HEIGHT_WEEK, t.day + 2, HEADER_ROWS)).join('');
            container.innerHTML = html;
        }

        function renderAll() {
            saveState();
            renderTodoList();
            if (currentView === 'day') renderDayView();
            else renderWeekView();
        }

        // ---- view switching ----
        function setView(view) {
            currentView = view;
            const dayBtn = document.getElementById('dayViewBtn');
            const weekBtn = document.getElementById('weekViewBtn');
            const dayContainer = document.getElementById('dayViewContainer');
            const weekContainer = document.getElementById('weekViewContainer');
            const title = document.getElementById('panelTitle');
            const subtitle = document.getElementById('panelSubtitle');

            const active = 'bg-[var(--surface)] shadow-sm text-[var(--accent)]';
            const inactive = 'text-[var(--text-muted)] hover:text-[var(--text)]';

            if (view === 'day') {
                dayBtn.className = `view-toggle-btn px-3.5 py-1.5 rounded-[5px] text-xs font-medium ${active}`;
                weekBtn.className = `view-toggle-btn px-3.5 py-1.5 rounded-[5px] text-xs font-medium ${inactive}`;
                dayContainer.classList.remove('hidden');
                weekContainer.classList.add('hidden');
                title.textContent = '오늘의 타임라인';
                subtitle.textContent = `${fmtDate(today)} (${DAY_LABELS[todayIndex]})`;
            } else {
                weekBtn.className = `view-toggle-btn px-3.5 py-1.5 rounded-[5px] text-xs font-medium ${active}`;
                dayBtn.className = `view-toggle-btn px-3.5 py-1.5 rounded-[5px] text-xs font-medium ${inactive}`;
                weekContainer.classList.remove('hidden');
                dayContainer.classList.add('hidden');
                title.textContent = '이번 주';
                subtitle.textContent = `${fmtDate(weekDates[0])} - ${fmtDate(weekDates[6])}`;
            }
            renderAll();
        }

        // ---- adding tasks ----
        function addTask() {
            const input = document.getElementById('taskInput');
            const text = input.value.trim();
            if (!text) return;
            const color = PALETTE_KEYS[taskIdCounter % PALETTE_KEYS.length];
            tasks.push({ id: `task-${taskIdCounter++}`, text, color, day: null, hour: null, duration: 1 });
            input.value = '';
            renderAll();
        }
        document.getElementById('taskInput').addEventListener('keypress', e => {
            if (e.key === 'Enter') addTask();
        });

        // ---- deleting / returning tasks ----
        document.addEventListener('click', e => {
            const delBtn = e.target.closest('.delete-btn');
            if (!delBtn) return;
            e.stopPropagation();
            const id = delBtn.dataset.taskId;
            const task = tasks.find(t => t.id === id);
            if (!task) return;
            if (task.day !== null) {
                // placed on a timeline -> send back to the backlog list
                task.day = null;
                task.hour = null;
            } else {
                // already in the backlog -> remove for good
                tasks = tasks.filter(t => t.id !== id);
            }
            renderAll();
        });

        // ---- resizing (extend a placed task across multiple hours) ----
        document.addEventListener('mousedown', e => {
            const handle = e.target.closest('.resize-handle');
            if (!handle) return;
            e.preventDefault();
            e.stopPropagation();
            const task = tasks.find(t => t.id === handle.dataset.taskId);
            if (!task) return;
            const rowHeight = parseInt(handle.dataset.rowHeight, 10);
            const startY = e.clientY;
            const startDuration = task.duration;
            const maxDuration = TOTAL_ROWS - (task.hour - START_HOUR);

            function onMove(ev) {
                const deltaRows = Math.round((ev.clientY - startY) / rowHeight);
                const newDuration = Math.max(1, Math.min(startDuration + deltaRows, maxDuration));
                if (newDuration !== task.duration) {
                    task.duration = newDuration;
                    renderAll();
                }
            }
            function onUp() {
                document.removeEventListener('mousemove', onMove);
                document.removeEventListener('mouseup', onUp);
            }
            document.addEventListener('mousemove', onMove);
            document.addEventListener('mouseup', onUp);
        });

        // ---- drag and drop (delegated, state-driven) ----
        document.addEventListener('dragstart', e => {
            const card = e.target.closest('.task-card');
            if (!card) return;
            draggedTaskId = card.dataset.taskId;
            e.dataTransfer.setData('text/plain', draggedTaskId);
            setTimeout(() => card.classList.add('dragging'), 0);
        });
        document.addEventListener('dragend', e => {
            const card = e.target.closest('.task-card');
            if (card) card.classList.remove('dragging');
        });

        function setupDropZone(containerId) {
            const container = document.getElementById(containerId);
            container.addEventListener('dragover', e => {
                e.preventDefault();
                const slot = e.target.closest('.time-slot');
                container.querySelectorAll('.time-slot.drag-over').forEach(s => {
                    if (s !== slot) s.classList.remove('drag-over');
                });
                if (slot) slot.classList.add('drag-over');
            });
            container.addEventListener('dragleave', e => {
                const slot = e.target.closest('.time-slot');
                if (slot && !slot.contains(e.relatedTarget)) slot.classList.remove('drag-over');
            });
            container.addEventListener('drop', e => {
                e.preventDefault();
                container.querySelectorAll('.time-slot.drag-over').forEach(s => s.classList.remove('drag-over'));
                const id = e.dataTransfer.getData('text/plain') || draggedTaskId;
                const task = tasks.find(t => t.id === id);
                if (!task) return;

                const slot = e.target.closest('.time-slot');
                if (!slot) {
                    // dropped on the backlog list itself
                    task.day = null;
                    task.hour = null;
                } else if (slot.dataset.day !== undefined && slot.dataset.day !== '') {
                    // week view slot
                    task.day = parseInt(slot.dataset.day, 10);
                    task.hour = parseInt(slot.dataset.hour, 10);
                    task.duration = clampDuration(task.hour, task.duration);
                } else {
                    // day view slot -> always today's column
                    task.day = todayIndex;
                    task.hour = parseInt(slot.dataset.hour, 10);
                    task.duration = clampDuration(task.hour, task.duration);
                }
                renderAll();
            });
        }
        setupDropZone('todoList');
        setupDropZone('dayViewContainer');
        setupDropZone('weekViewContainer');

        // ---- init ----
        loadState();
        setView('day');
    </script>
</body>
</html>
